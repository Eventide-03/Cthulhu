# Builds Cthulhu for macOS (universal: arm64 + x86_64) and Windows x64, then
# publishes a GitHub Release on a version tag.
#
# Artifacts are named predictably so the download page and update manifests can
# hardcode them:
#   Cthulhu-<version>-macos-universal.dmg
#   Cthulhu-<version>-windows-x64.exe
#
# STATUS: the Windows job is `continue-on-error` on purpose -- Windows has not
# been validated yet (post-Phase-8 shakedown), and a Windows failure must not
# block a Mac release. Remove that line once Windows is known good.

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run the Windows job"
        type: boolean
        default: true

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SURFER_VERSION: "1.14.6"
  SCCACHE_CACHE_SIZE: "2G"
  APP_NAME: "Cthulhu"

jobs:
  # ===========================================================================
  # macOS build -- ONE ARCHITECTURE PER JOB, run in parallel.
  #
  # WHY SPLIT: a single Firefox compile on a macos-latest runner measured
  # 4h48m (run 32919948246). Two of them back to back in one job needs ~9.5h
  # against GitHub's 6h ceiling, so the previous single-job universal build
  # could never have passed -- even with every other bug fixed, the second arch
  # would have been killed mid-compile. Split, each job carries one ~5h build
  # and they run concurrently; macos-merge then does the cheap part.
  #
  # Surfer has no universal-build support: `surfer build` just runs `./mach
  # build` for the host arch. The target and objdir are injected through
  # Surfer's root ./mozconfig override slot, which it appends AFTER
  # configs/macos/mozconfig. That file deliberately carries neither, so a plain
  # local `surfer build` is unaffected.
  #
  # MOZ_OBJDIR is still set explicitly even though both arches now use the same
  # name: Firefox derives its default objdir from the HOST triple, so the
  # x86_64 leg would otherwise build into a directory named for aarch64 -- true,
  # since the runner is arm64, but actively misleading to anyone reading a log.
  # Pinning it also keeps the path identical across both legs, which Info.plist
  # depends on (see the matrix comment below).
  # ===========================================================================
  macos-build:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 360
    strategy:
      # Keep going if one arch fails -- a broken x86_64 should not throw away a
      # good 5-hour arm64 build, and vice versa.
      fail-fast: false
      # objdir is DELIBERATELY THE SAME for both arches. Info.plist embeds the
      # absolute object directory:
      #   <key>MozillaDeveloperObjPath</key>
      #   <string>/Users/runner/work/Cthulhu/Cthulhu/engine/obj-...</string>
      # (browser/app/Makefile.in passes -DMOZ_DEVELOPER_OBJ_PATH=$(topobjdir)).
      # With per-arch names those strings differ, so unify.py rejects Info.plist
      # and the three helper .apps no matter how the build ID is pinned.
      #
      # Distinct objdirs were only ever needed because both compiles shared one
      # job and one filesystem. They are separate runners now, with identical
      # workspace paths, so one shared name makes the plists byte-identical.
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            objdir: obj
          - arch: x86_64
            target: x86_64-apple-darwin
            objdir: obj
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./surfer.json').brands.release.release.displayVersion")-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      # BOTH ARCHES MUST SHARE ONE BUILD ID, or unify.py refuses to merge them:
      #   error: Can't unify Contents/Resources/application.ini: file differs
      #   error: Can't unify Contents/Resources/platform.ini: file differs
      #   error: Can't unify Contents/Resources/modules/AppConstants.sys.mjs
      #   error: Can't unify Contents/Info.plist   (+ the three helper .apps)
      #
      # Every one of those differences is the build timestamp: application.ini
      # carries BuildID=, AppConstants carries MOZ_BUILDID, and the macOS
      # CFBundleVersion is derived from the build date too (e.g. "126.8.24").
      # UnifiedBuildFinder only tolerates *.manifest ordering, buildconfig.html
      # and install.rdf -- it has no special case for any of these, so they must
      # be byte-identical.
      #
      # The two legs are separate jobs that start seconds apart, so
      # datetime.now() gives them different IDs. Pin MOZ_BUILD_DATE to the
      # COMMIT timestamp: both legs check out the same commit, so both compute
      # the same value with no cross-job coordination.
      #
      # build/variables.py silently ignores the variable unless it is EXACTLY
      # 14 characters, falling back to datetime.now() -- which would look like
      # this fix simply did not work. Length is asserted below.
      - name: Pin a shared build ID across both arches
        run: |
          set -euo pipefail
          BD="$(TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD)"
          [ "${#BD}" -eq 14 ] || { echo "::error::MOZ_BUILD_DATE must be 14 chars, got '${BD}' (${#BD})"; exit 1; }
          echo "MOZ_BUILD_DATE=$BD" >> "$GITHUB_ENV"
          echo "Shared build ID: $BD"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes || true
          sudo rm -rf ~/Library/Developer/Xcode/iOS\ DeviceSupport || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Surfer
        run: npm install -g "@zen-browser/surfer@${SURFER_VERSION}"

      - name: Install sccache
        run: brew install sccache

      # The runners ship a rustup toolchain with ONLY the host target installed
      # (aarch64-apple-darwin). Cross-compiling to x86_64 then dies 24s into
      # configure, at "checking for rust target triplet":
      #   error[E0463]: can't find crate for `std`
      #   ERROR: Cannot compile for x86_64-apple-darwin with .../rustc
      # This is what killed run 32919948246 after a successful 4h48m arm64
      # build. Adding the host's own target is a no-op, so this runs for both.
      - name: Ensure the Rust target is installed
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          rustup target list --installed

      # ---- CACHE BUDGET -----------------------------------------------------
      # GitHub caps the Actions cache at 10 GB per repo, evicting LRU. The
      # extracted Firefox source is ~4 GB and an objdir is 10-20 GB, so caching
      # either would blow the budget and evict the one thing that actually saves
      # wall-clock: the compiler object cache.
      #
      # The key is per-ARCH: the two matrix legs compile different object code
      # and would otherwise evict each other on every run.
      # -----------------------------------------------------------------------
      - name: Cache sccache objects
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Mozilla.sccache
          key: sccache-macos-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            sccache-macos-${{ matrix.arch }}-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: .surfer/engine
          key: ff-src-${{ hashFiles('surfer.json') }}

      - name: Download Firefox source
        run: surfer download

      - name: Apply patches
        run: surfer import

      # Packaged in the SAME step that builds it, while its own ./mozconfig is
      # active -- mach reads target and objdir from that file. `mach package` is
      # required because unify.py expects packaged (omni.ja) apps; that is how
      # Mozilla drives it.
      - name: Build + package ${{ matrix.arch }}
        run: |
          cat > mozconfig <<EOF
          ac_add_options --target=${{ matrix.target }}
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/${{ matrix.objdir }}
          EOF
          cat mozconfig
          surfer build --skip-patch-check
          (cd engine && ./mach package)

      # The .app that `mach package` leaves in dist/ is NOT a self-contained
      # bundle -- it is mostly a farm of symlinks pointing at ABSOLUTE paths
      # inside the objdir (measured: 7575 symlinks, 0 of them relative). That
      # includes essential files, not just test binaries:
      #   Contents/Resources/application.ini    -> <objdir>/build/application.ini
      #   Contents/Resources/dependentlibs.list -> <objdir>/toolkit/library/...
      # It works in place because the targets exist; it does not survive being
      # moved to another machine.
      #
      # So dereference with `tar -h`, producing a real bundle (276M of links ->
      # 409M of content). Without this, unify.py in the merge job dies on the
      # first unreadable link:
      #   FileNotFoundError: .../Cthulhu.app/Contents/MacOS/http3server
      #
      # Prune genuinely-dangling links FIRST -- `tar -h` treats one as a hard
      # error, and a link that resolves nowhere has nothing to dereference.
      #
      # (upload-artifact also zips its input, which discards symlinks and the
      # executable bit, so tarring is required regardless.)
      - name: Archive the .app
        run: |
          set -euo pipefail
          cd "engine/${{ matrix.objdir }}/dist"
          APP="$(ls -d *.app | head -1)"
          [ -n "$APP" ] || { echo "::error::no .app in ${{ matrix.objdir }}/dist"; exit 1; }

          dangling=0
          while IFS= read -r l; do
            echo "  pruning dangling symlink: ${l#$APP/} -> $(readlink "$l")"
            rm -f "$l"; dangling=$((dangling + 1))
          done < <(find "$APP" -type l ! -exec test -e {} \; -print)
          echo "Pruned $dangling dangling symlink(s)."

          # BUILD-TOOL STRAYS. These are build-time artifacts that `mach package`
          # copies into the bundle but that no shipped browser needs, and each
          # breaks unify.py in its own way. Dropped from BOTH legs so the two
          # trees stay symmetric -- unify errors on any path present in one and
          # missing from the other.
          #
          #   rapl      Intel's power-measurement CLI, gated in tools/power/
          #             moz.build on TARGET_CPU == "x86_64", so it cannot exist
          #             on arm64:
          #               error: File missing in arm64: Contents/Resources/rapl
          #
          #   nsinstall A HOST build utility (a file-installer, like install(1)).
          #             Host tools are built for the machine doing the building,
          #             so on the cross leg the "x86_64" bundle contains an ARM64
          #             nsinstall. unify hands every Mach-O pair to lipo, which
          #             refuses two slices of the same arch:
          #               lipo: ... have the same architectures (arm64) and
          #               can't be in the same fat output file
          #             Confirmed by scanning the actual CI artifact: nsinstall
          #             is the ONLY binary in the x86_64 bundle that is not
          #             x86_64, so it is the only such collision.
          for stray in Contents/Resources/rapl Contents/Resources/nsinstall; do
            if [ -e "$APP/$stray" ]; then
              echo "  dropping arch-only stray: $stray"
              rm -rf "${APP:?}/$stray"
            fi
          done

          # Early warning for the NEXT host-tool leak. unify only discovers an
          # arch mismatch after both 4-hour compiles have finished, and reports
          # it as an opaque lipo error. Surface it here instead, where the log
          # names the file directly. Warn rather than fail: a stray that unify
          # happens to tolerate should not throw away a good build.
          case "${{ matrix.arch }}" in
            arm64)  want=arm64  ;;
            x86_64) want=x86_64 ;;
          esac
          find "$APP" -type f -perm +111 | while read -r f; do
            t="$(file -b "$f" 2>/dev/null)"
            case "$t" in
              *Mach-O*)
                case "$t" in
                  *"$want"*) ;;
                  *) echo "::warning::${f#$APP/} is not $want ($t) -- likely a host tool that will break unify" ;;
                esac ;;
            esac
          done

          echo "Archiving $APP (dereferencing symlinks)"
          tar -czhf "$GITHUB_WORKSPACE/macos-${{ matrix.arch }}-app.tar.gz" "$APP"
          ls -lh "$GITHUB_WORKSPACE/macos-${{ matrix.arch }}-app.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: macos-${{ matrix.arch }}-app.tar.gz
          if-no-files-found: error
          retention-days: 3

      # The merge job needs `mar` and `signmar`, and those only exist as build
      # outputs. Ship them from the x86_64 leg (arbitrary -- either would do)
      # rather than making the merge job compile anything. signmar is linked
      # against the NSS/NSPR dylibs next to it, so they travel too.
      - name: Archive the MAR tooling
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          cd "engine/${{ matrix.objdir }}"
          [ -x dist/bin/signmar ]    || { echo "::error::dist/bin/signmar missing";    exit 1; }
          [ -x dist/host/bin/mar ]   || { echo "::error::dist/host/bin/mar missing";   exit 1; }
          tar -czf "$GITHUB_WORKSPACE/macos-martools.tar.gz" \
            dist/bin/signmar dist/host/bin/mar $(ls dist/bin/*.dylib 2>/dev/null || true)
          ls -lh "$GITHUB_WORKSPACE/macos-martools.tar.gz"

      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x86_64'
        with:
          name: macos-martools
          path: macos-martools.tar.gz
          if-no-files-found: error
          retention-days: 3

  # ===========================================================================
  # macOS merge -- unify, sign, notarize, package, MAR.
  #
  # Everything here is minutes, not hours: no compilation happens. It does need
  # a Firefox source tree, because `mach python` drives both unify.py and
  # make_dmg, so it re-runs surfer download + import (~15 min) rather than
  # dragging a 4 GB tree through the artifact store.
  # ===========================================================================
  macos-merge:
    name: macOS (universal)
    needs: macos-build
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./surfer.json').brands.release.release.displayVersion")-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Version: $V"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Surfer
        run: npm install -g "@zen-browser/surfer@${SURFER_VERSION}"

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: .surfer/engine
          key: ff-src-${{ hashFiles('surfer.json') }}

      # A source tree only -- nothing is compiled here. `mach python` needs the
      # tree to bootstrap its virtualenv; patches are applied so the tree
      # matches what was built.
      - name: Download Firefox source
        run: surfer download

      - name: Apply patches
        run: surfer import

      - uses: actions/download-artifact@v4
        with:
          name: macos-app-arm64
          path: incoming

      - uses: actions/download-artifact@v4
        with:
          name: macos-app-x86_64
          path: incoming

      - uses: actions/download-artifact@v4
        with:
          name: macos-martools
          path: incoming

      - name: Unpack the build outputs
        run: |
          set -euo pipefail
          mkdir -p stage/arm64 stage/x86_64 martools
          tar -xzf incoming/macos-arm64-app.tar.gz  -C stage/arm64
          tar -xzf incoming/macos-x86_64-app.tar.gz -C stage/x86_64
          tar -xzf incoming/macos-martools.tar.gz   -C martools
          ARM="$PWD/stage/arm64/$(ls stage/arm64 | head -1)"
          X64="$PWD/stage/x86_64/$(ls stage/x86_64 | head -1)"
          [ -d "$ARM" ] && [ -d "$X64" ] || { echo "::error::could not locate both .app bundles"; exit 1; }
          echo "ARM_APP=$ARM" >> "$GITHUB_ENV"
          echo "X64_APP=$X64" >> "$GITHUB_ENV"
          chmod +x martools/dist/bin/signmar martools/dist/host/bin/mar
          ls -l "$ARM" "$X64"

      # unify.py merges app2 INTO app1 in place, so the x86_64 tree becomes the
      # universal one.
      - name: Unify into a universal app
        run: |
          set -euo pipefail
          cd engine
          LIPO=lipo ./mach python toolkit/mozapps/installer/unify.py "$X64_APP" "$ARM_APP"
          echo "UNIVERSAL_APP=$X64_APP" >> "$GITHUB_ENV"

      - name: Verify universal binary
        run: |
          BIN="$UNIVERSAL_APP/Contents/MacOS/$APP_NAME"
          [ -f "$BIN" ] || BIN=$(find "$UNIVERSAL_APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 | head -1)
          lipo -archs "$BIN"
          lipo -archs "$BIN" | grep -q arm64  || { echo "::error::arm64 slice missing";  exit 1; }
          lipo -archs "$BIN" | grep -q x86_64 || { echo "::error::x86_64 slice missing"; exit 1; }

      # =======================================================================
      # macOS SIGNING + NOTARIZATION
      #
      # Runs only when the signing secrets are present. Without them the job
      # still completes and produces an UNSIGNED .dmg, with a loud warning --
      # useful for testing the pipeline before an Apple Developer account
      # exists. Notarization REQUIRES a paid Apple Developer Program
      # membership; there is no free tier.
      #
      # Secrets: MACOS_CERT_P12 (base64 .p12), MACOS_CERT_PASSWORD,
      #          MACOS_SIGN_IDENTITY ("Developer ID Application: ..."),
      #          APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific).
      # Put these in a protected Environment so fork PRs can never reach them.
      #
      # ⚠️ LEAST-VERIFIED STEP. Firefox ships PER-BINARY entitlements
      # (security/mac/hardenedruntime/production/*.xml) -- a blanket
      # `codesign --deep` applies the browser entitlements to sandboxed helpers
      # and breaks them. We sign inside-out with the per-binary entitlements
      # below, but that mapping should be checked against Mozilla's own signing
      # config before the first real release.
      # =======================================================================
      - name: Sign the app
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12:-}" ]; then
            echo "::warning::No macOS signing secrets set -- producing an UNSIGNED, UN-NOTARIZED .dmg. Gatekeeper will refuse to open it on other machines."
            echo "SIGNED=0" >> "$GITHUB_ENV"; exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KCPASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KCPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPASS" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"

          ENT=engine/security/mac/hardenedruntime/production
          sign() { codesign --force --timestamp --options runtime --sign "$MACOS_SIGN_IDENTITY" "$@"; }

          # Inside-out: nested helpers first, each with its own entitlements,
          # then everything else, then the outer bundle last.
          find "$UNIVERSAL_APP/Contents/MacOS" -name 'plugin-container.app' -maxdepth 2 -print0 |
            while IFS= read -r -d '' p; do sign --entitlements "$ENT/plugin-container.xml" "$p"; done
          find "$UNIVERSAL_APP" \( -name '*.dylib' -o -name '*.so' \) -print0 |
            while IFS= read -r -d '' f; do sign "$f"; done
          find "$UNIVERSAL_APP/Contents/MacOS" -maxdepth 1 -type f -perm +111 -print0 |
            while IFS= read -r -d '' f; do sign "$f"; done
          sign --entitlements "$ENT/firefox.browser.xml" "$UNIVERSAL_APP"

          codesign --verify --deep --strict --verbose=2 "$UNIVERSAL_APP"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build the .dmg
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -R "$UNIVERSAL_APP" "$STAGE/"
          DMG="$PWD/${APP_NAME}-${VERSION}-macos-universal.dmg"
          # create_dmg() adds the /Applications drag target itself (a symlink
          # named " " so it needs no localisation) -- see mozpack/dmg.py.
          # On macOS it drives hdiutil natively; the dmg/hfsplus toolchains are
          # only needed when building a DMG on Linux.
          (cd engine && ./mach python -m mozbuild.action.make_dmg \
            --volume-name "$APP_NAME" "$STAGE" "$DMG")
          echo "DMG_PATH=$DMG" >> "$GITHUB_ENV"
          ls -lh "$DMG"

      - name: Sign, notarize and staple the .dmg
        if: env.SIGNED == '1'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"

      # =======================================================================
      # COMPLETE MAR -- the artifact the updater actually consumes.
      #
      # Complete (not partial/diff) on purpose: a complete MAR updates from ANY
      # previous version, so one file serves every client. Partials are a
      # bandwidth optimisation that needs one MAR per from->to pair.
      #
      # Built from the SIGNED, STAPLED .app so the updated installation keeps a
      # valid signature -- building the MAR before signing would ship unsigned
      # binaries to everyone who updates.
      # =======================================================================
      - name: Build, sign and verify the complete MAR
        env:
          MAR_SIGNING_DB_B64: ${{ secrets.MAR_SIGNING_DB_B64 }}
        run: |
          set -euo pipefail
          # Nothing was compiled in this job -- mar/signmar come from the
          # x86_64 build job's `macos-martools` artifact. signmar dlopens the
          # NSS/NSPR dylibs that shipped alongside it.
          TOOLS="$GITHUB_WORKSPACE/martools"
          export DYLD_LIBRARY_PATH="$TOOLS/dist/bin"
          SIGNMAR="$TOOLS/dist/bin/signmar"
          MAR_BIN="$TOOLS/dist/host/bin/mar"
          DER="$GITHUB_WORKSPACE/src/toolkit/mozapps/update/updater/release_primary.der"

          BUILDID=$(sed -n 's/^BuildID=//p' "$UNIVERSAL_APP/Contents/Resources/application.ini" | head -1)
          [ -n "$BUILDID" ] || { echo "::error::could not read BuildID"; exit 1; }
          echo "MAC_BUILDID=$BUILDID" >> "$GITHUB_ENV"

          OUT="$GITHUB_WORKSPACE/${APP_NAME}-${VERSION}-macos-universal.complete.mar"
          (cd "$GITHUB_WORKSPACE/engine" && \
            MAR="$MAR_BIN" \
            MOZ_PRODUCT_VERSION="$VERSION" \
            MAR_CHANNEL_ID="release" \
            tools/update-packaging/make_full_update.sh "$OUT.unsigned" "$UNIVERSAL_APP")

          if [ -z "${MAR_SIGNING_DB_B64:-}" ]; then
            echo "::error::MAR_SIGNING_DB_B64 is not set. Refusing to publish an unsigned MAR -- the browser would reject it, so shipping one would silently break updates."
            exit 1
          fi
          KEYDIR="$RUNNER_TEMP/markeys"; rm -rf "$KEYDIR"; mkdir -p "$KEYDIR"
          echo "$MAR_SIGNING_DB_B64" | base64 --decode | tar xz -C "$KEYDIR"
          "$SIGNMAR" -d "$KEYDIR" -n cthulhu-mar -s "$OUT.unsigned" "$OUT"

          # Verify BEFORE publishing. An unverifiable MAR is worse than no
          # update at all: clients download it, reject it, and retry forever.
          "$SIGNMAR" -D "$DER" -v "$OUT" \
            || { echo "::error::MAR signature verification FAILED -- not publishing"; exit 1; }
          echo "MAR signature verified against the baked-in certificate."

          rm -rf "$KEYDIR" "$OUT.unsigned"
          echo "MAC_MAR=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            ${{ env.DMG_PATH }}
            ${{ env.MAC_MAR }}
          if-no-files-found: error
          retention-days: 14

      - name: Export macOS buildid for the release job
        run: echo "${MAC_BUILDID}" > macos-buildid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: macos-buildid
          path: macos-buildid.txt
          if-no-files-found: error

  # ===========================================================================
  # Windows x64 -- NSIS installer, DELIBERATELY UNSIGNED
  # ===========================================================================
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 360
    continue-on-error: true
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./surfer.json').brands.release.release.displayVersion")-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          set -x
          rm -rf "/c/Program Files/dotnet" || true
          rm -rf "/c/Program Files (x86)/Android" || true
          rm -rf "/c/hostedtoolcache/windows/Java_Temurin-Hotspot_jdk" || true
          df -h /c

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Surfer runs the build as `./mach` with no shell. On Windows that only
      # works because execa -> cross-spawn reads mach's `#!/usr/bin/env python3`
      # shebang and re-spawns it as `python3 ./mach`. So the interpreter must be
      # reachable as literally `python3` -- Windows Python ships `python.exe`
      # and may have no `python3.exe`, in which case the build dies at spawn
      # with ENOENT. Shim it if absent.
      - name: Ensure python3 is on PATH
        shell: pwsh
        run: |
          if (-not (Get-Command python3 -ErrorAction SilentlyContinue)) {
            $dir = Join-Path $env:RUNNER_TEMP "py3shim"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -Path (Join-Path $dir "python3.cmd") -Value "@echo off`r`npython %*"
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            Write-Host "Added python3 shim at $dir"
          } else {
            Write-Host "python3 already present: $((Get-Command python3).Source)"
          }

      # Surfer must be installed on the SAME DRIVE as the workspace.
      #
      # Its windowsPathToUnix() (dist/utils/fs.js) strips the drive letter from
      # absolute paths before reading them:
      #   C:\npm\prefix\...\configure.sh  ->  /npm/prefix/.../configure.sh
      # Node then resolves that leading slash against the CURRENT drive. The
      # runner installs global npm packages on C: but checks the repo out on D:,
      # so surfer looks for its own bundled template on D: and dies:
      #   ENOENT: open 'D:\npm\prefix\...\template\branding.optional\configure.sh'
      # while its code is demonstrably running from C:\npm\prefix.
      #
      # Putting the prefix on the workspace drive makes the drive-stripping a
      # no-op rather than a corruption. UNTESTED beyond this reasoning -- Windows
      # has never built successfully, and this only clears the next blocker.
      - name: Install Surfer
        run: |
          set -euo pipefail
          # Forward slashes on purpose: Windows accepts them, and they avoid a
          # backslash surviving two levels of shell quoting.
          DRIVE="${GITHUB_WORKSPACE%%:*}"          # e.g. "D"
          PREFIX="${DRIVE}:/npm-global"
          echo "Workspace drive: ${DRIVE}: -- installing surfer to ${PREFIX}"
          npm config set prefix "$PREFIX"
          echo "${PREFIX}" >> "$GITHUB_PATH"
          npm install -g "@zen-browser/surfer@${SURFER_VERSION}"

      # Non-fatal: configs/windows/mozconfig guards --with-ccache behind a
      # `command -v sccache` check, so a failed install means a slow build
      # rather than a broken one.
      - name: Install sccache
        continue-on-error: true
        run: choco install sccache -y --no-progress

      # NSIS is what turns the packaged build into setup.exe (makensis.mk's
      # `installer::` target needs MAKENSISU). --enable-bootstrap normally
      # fetches an NSIS toolchain; this is a belt-and-braces fallback.
      - name: Install NSIS
        continue-on-error: true
        run: choco install nsis -y --no-progress

      - name: Cache sccache objects
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Mozilla/sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: |
            sccache-windows-

      - name: Cache Firefox source tarball
        uses: actions/cache@v4
        with:
          path: .surfer/engine
          key: ff-src-${{ hashFiles('surfer.json') }}

      # Surfer's Windows unpack path is BROKEN for every ESR release, so we do
      # it ourselves. `surfer download` extracts with 7z and then moves a
      # directory it *names* `firefox-<config.version.version>` -- but Mozilla's
      # tarball `firefox-153.0esr.source.tar.xz` contains a top-level directory
      # called `firefox-153.0`, with NO `esr` suffix. The move then dies with
      #   ENOENT: lstat '...\.surfer\engine\firefox-153.0esr'
      # (surfer dist/commands/download/firefox.js, unpackFirefoxSource).
      #
      # macOS/Linux never hit this because that branch pipes the tarball through
      # `tar --strip-components=1`, which does not care what the directory is
      # called. Only the Windows branch hardcodes the name.
      #
      # The 7z extraction itself is fine -- CI logs show both passes completing
      # -- so we keep it and just discover the directory by glob instead of
      # guessing its name. `surfer import` then proceeds normally.
      - name: Download and unpack Firefox source
        run: |
          set -euo pipefail
          FFVER="$(node -p "require('./surfer.json').version.version")"
          TMP=".surfer/engine"
          TARBALL="$TMP/firefox-${FFVER}.source.tar.xz"
          mkdir -p "$TMP"

          if [ ! -f "$TARBALL" ]; then
            URL="https://archive.mozilla.org/pub/firefox/releases/${FFVER}/source/firefox-${FFVER}.source.tar.xz"
            echo "Downloading $URL"
            curl -fL --retry 3 --retry-delay 5 -o "$TARBALL" "$URL"
          else
            echo "Using cached $TARBALL"
          fi

          7z x "$TARBALL" -o"$TMP" -y >/dev/null
          7z x "$TMP/firefox-${FFVER}.source.tar" -o"$TMP" -y >/dev/null

          # Whatever the inner directory is called, there is exactly one.
          SRCDIR="$(find "$TMP" -maxdepth 1 -mindepth 1 -type d -name 'firefox-*' | head -1)"
          [ -n "$SRCDIR" ] || { echo "::error::no firefox-* directory after extraction"; exit 1; }
          echo "Extracted source directory: $SRCDIR"

          rm -rf engine
          mv "$SRCDIR" engine
          [ -f engine/mach ] || { echo "::error::engine/mach missing after extract"; exit 1; }
          rm -f "$TMP/firefox-${FFVER}.source.tar"

      - name: Apply patches
        run: surfer import

      # UNCERTAIN: Firefox on Windows expects the MozillaBuild environment
      # (MSYS bash, GNU make). windows-latest ships VS 2022 and Python but NOT
      # MozillaBuild. `mach bootstrap` is the supported way in; if it cannot
      # provision the environment this is the step that fails first.
      - name: Bootstrap build environment
        run: |
          cd engine
          ./mach --no-interactive bootstrap --application-choice browser

      - name: Build
        run: surfer build --skip-patch-check

      - name: Package + build NSIS installer
        run: |
          set -euo pipefail
          cd engine
          ./mach package
          # `installer::` lives in toolkit/mozapps/installer/windows/nsis/
          # makensis.mk and emits $(DIST)/$(PKG_PATH)$(PKG_INST_BASENAME).exe,
          # i.e. obj-*/dist/install/sea/*.exe.
          ./mach build installer

      # =======================================================================
      # WINDOWS CODE SIGNING: INTENTIONALLY ABSENT
      #
      # There is NO Authenticode / Azure Trusted Signing step here, and that is
      # a deliberate decision -- not an oversight and not a TODO. Cthulhu does
      # not pay for a code-signing certificate, so Windows builds ship UNSIGNED.
      #
      # Consequence: SmartScreen shows "Windows protected your PC" on download
      # and first run. Users click "More info" -> "Run anyway". The download
      # page (docs/index.html) explains this, and it must keep doing so.
      #
      # Please do not "fix" this by adding a signing step. If free signing is
      # ever pursued, see docs/windows-signing.md -- it covers OSSign (the
      # service LibreWolf uses) and what applying would involve. Nothing there
      # is implemented yet.
      #
      # Note that signing alone would NOT immediately remove the SmartScreen
      # warning: reputation accrues per-certificate over time, so the download
      # page note stays relevant either way.
      # =======================================================================

      - name: Rename installer
        run: |
          set -euo pipefail
          cd engine
          EXE=$(ls obj-*/dist/install/sea/*.exe 2>/dev/null | head -1)
          [ -n "$EXE" ] || { echo "::error::no NSIS installer found under dist/install/sea"; exit 1; }
          OUT="$GITHUB_WORKSPACE/${APP_NAME}-${VERSION}-windows-x64.exe"
          cp "$EXE" "$OUT"
          echo "EXE_PATH=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      # Complete MAR -- see the macOS job for why complete rather than partial.
      # The MAR is built from the packaged staging directory (the one containing
      # `precomplete`), NOT from the installer.
      - name: Build, sign and verify the complete MAR
        env:
          MAR_SIGNING_DB_B64: ${{ secrets.MAR_SIGNING_DB_B64 }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/engine"
          OBJ=$(ls -d obj-* | head -1)
          PRE=$(find "$OBJ/dist" -maxdepth 3 -name precomplete | head -1)
          [ -n "$PRE" ] || { echo "::error::no precomplete found -- cannot locate the packaged tree"; exit 1; }
          APPDIR=$(dirname "$PRE")
          echo "Packaged tree: $APPDIR"

          BUILDID=$(sed -n 's/^BuildID=//p' "$APPDIR/application.ini" | head -1)
          [ -n "$BUILDID" ] || { echo "::error::could not read BuildID"; exit 1; }
          echo "WIN_BUILDID=$BUILDID" >> "$GITHUB_ENV"

          OUT="$GITHUB_WORKSPACE/${APP_NAME}-${VERSION}-windows-x64.complete.mar"
          MAR="$PWD/$OBJ/dist/host/bin/mar" \
          MOZ_PRODUCT_VERSION="$VERSION" \
          MAR_CHANNEL_ID="release" \
            tools/update-packaging/make_full_update.sh "$OUT.unsigned" "$APPDIR"

          if [ -z "${MAR_SIGNING_DB_B64:-}" ]; then
            echo "::error::MAR_SIGNING_DB_B64 is not set. Refusing to publish an unsigned MAR."
            exit 1
          fi
          KEYDIR="$RUNNER_TEMP/markeys"; rm -rf "$KEYDIR"; mkdir -p "$KEYDIR"
          echo "$MAR_SIGNING_DB_B64" | base64 --decode | tar xz -C "$KEYDIR"
          "$PWD/$OBJ/dist/bin/signmar" -d "$KEYDIR" -n cthulhu-mar -s "$OUT.unsigned" "$OUT"
          "$PWD/$OBJ/dist/bin/signmar" \
            -D "$GITHUB_WORKSPACE/src/toolkit/mozapps/update/updater/release_primary.der" -v "$OUT" \
            || { echo "::error::MAR signature verification FAILED -- not publishing"; exit 1; }
          echo "MAR signature verified."
          rm -rf "$KEYDIR" "$OUT.unsigned"
          echo "WIN_MAR=$OUT" >> "$GITHUB_ENV"
          ls -lh "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            ${{ env.EXE_PATH }}
            ${{ env.WIN_MAR }}
          if-no-files-found: error
          retention-days: 14

      - name: Export Windows buildid for the release job
        run: echo "${WIN_BUILDID}" > windows-buildid.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-buildid
          path: windows-buildid.txt
          if-no-files-found: error

  # ===========================================================================
  # Release -- tags only
  #
  # `windows` is continue-on-error, so `needs` sees it as successful even when
  # it failed. The Windows asset is therefore downloaded best-effort and the
  # release body says so if it is missing, rather than failing the release and
  # blocking a perfectly good Mac build.
  # ===========================================================================
  release:
    name: Release
    needs: [macos-merge, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history + tags to diff against the previous tag

      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: assets

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-installer
          path: assets

      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PREV=$(git tag --sort=-creatordate --list 'v*' | grep -vFx "$TAG" | head -1 || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; echo "Since $PREV"; else RANGE="$TAG"; echo "First release"; fi

          {
            echo "## Changes"
            echo
            git log --no-merges --pretty='- %s' "$RANGE" | grep -v '^- Co-Authored-By' || echo "- No commits found in range"
            echo
            echo "## Downloads"
            echo
            if ls assets/*.dmg >/dev/null 2>&1; then
              echo "- **macOS** (universal — Apple Silicon + Intel): \`$(basename assets/*.dmg)\`"
            fi
            if ls assets/*.exe >/dev/null 2>&1; then
              echo "- **Windows x64**: \`$(basename assets/*.exe)\`"
              echo
              echo "> Windows builds are **unsigned** — this is deliberate; Cthulhu does not pay for a code-signing certificate."
              echo "> SmartScreen will show \"Windows protected your PC\". Click **More info** → **Run anyway** to continue."
            else
              echo "- **Windows x64**: _not produced for this release — the Windows build did not succeed._"
            fi
            echo
            echo "## SHA256"
            echo
            echo '```'
            (cd assets && shasum -a 256 * )
            echo '```'
          } > notes.md
          cat notes.md

      - uses: actions/download-artifact@v4
        with:
          name: macos-buildid
          path: buildids
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: windows-buildid
          path: buildids

      # STEP 1 of 2 -- publish the MARs. This MUST happen before the manifests
      # that reference them are committed, or a client could fetch a manifest
      # pointing at a release asset that does not exist yet and fail its update.
      - name: Create release (publishes the MARs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --latest \
            assets/*
          echo "Release published with assets:"
          ls -1 assets | sed 's/^/  /'

      # STEP 2 of 2 -- now that the MARs are downloadable, point the manifests
      # at them and publish the what's-new page for this version.
      - name: Generate update manifests and what's-new page
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          MAC_BUILDID=$(cat buildids/macos-buildid.txt 2>/dev/null || echo "")
          WIN_BUILDID=$(cat buildids/windows-buildid.txt 2>/dev/null || echo "$MAC_BUILDID")

          ARGS=(--out docs/updates --channel release
                --version "$VERSION" --build-id "$MAC_BUILDID"
                --platform-version "$(node -p "require('./surfer.json').version.version.replace('esr','')")")

          MAC_MAR=$(ls assets/*macos-universal.complete.mar 2>/dev/null | head -1 || true)
          if [ -n "$MAC_MAR" ]; then
            ARGS+=(--macos-mar "$MAC_MAR" --macos-url "$BASE/$(basename "$MAC_MAR")"
                   --macos-buildid "$MAC_BUILDID")
          fi
          WIN_MAR=$(ls assets/*windows-x64.complete.mar 2>/dev/null | head -1 || true)
          if [ -n "$WIN_MAR" ]; then
            ARGS+=(--windows-mar "$WIN_MAR" --windows-url "$BASE/$(basename "$WIN_MAR")"
                   --windows-buildid "$WIN_BUILDID")
          else
            echo "::warning::No Windows MAR -- Windows manifests left untouched, so Windows clients keep whatever was previously advertised."
          fi

          python3 tools/update-manifests/generate.py "${ARGS[@]}"

          # What's-new page: template + this release's notes, at the versioned
          # path the post-update pref resolves to (startup.homepage_override_url
          # -> /whatsnew/%VERSION%/).
          OUTDIR="docs/whatsnew/$VERSION"
          mkdir -p "$OUTDIR"
          python3 - "$VERSION" <<'PY'
          import html, pathlib, re, sys
          version = sys.argv[1]
          tpl = pathlib.Path("docs/whatsnew/template.html").read_text()
          notes = pathlib.Path("notes.md").read_text()
          items = [l[2:].strip() for l in notes.splitlines() if l.startswith("- ")]
          body = ("<ul>" + "".join(f"<li>{html.escape(i)}</li>" for i in items) + "</ul>"
                  if items else "<p>Maintenance and internal improvements.</p>")
          out = tpl.replace("__VERSION__", html.escape(version)).replace("__NOTES__", body)
          pathlib.Path(f"docs/whatsnew/{version}/index.html").write_text(out)
          print(f"  wrote docs/whatsnew/{version}/index.html ({len(items)} items)")
          PY

      - name: Commit manifests to Pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/updates docs/whatsnew
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "Publish update manifests for ${GITHUB_REF_NAME}"
          # The tag build may be behind main; push explicitly to the branch.
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "Manifests published to Pages."
